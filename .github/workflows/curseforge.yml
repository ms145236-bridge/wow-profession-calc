name: 上傳 CurseForge

# 插件版本號（toc 的 ## Version）有變才上傳；也可以手動執行（force 全部上傳）
on:
  push:
    branches: [main]
    paths: ["addon/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "不管版本號有沒有變都上傳"
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 打包並上傳有改版號的插件
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
          CF_PROJECT_BridgeHealing: ${{ vars.CF_PROJECT_HEALING }}
          CF_PROJECT_BridgeProfession: ${{ vars.CF_PROJECT_PROFESSION }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_GAME_VERSION" ]; then echo "還沒設定 CF_API_TOKEN 或 CF_GAME_VERSION，跳過"; exit 0; fi
          git log -1 --format=%B > changelog.md
          for name in BridgeHealing BridgeProfession; do
            toc="addon/$name/$name.toc"
            ver=$(grep -m1 '^## Version:' "$toc" | cut -d' ' -f3 | tr -d '\r')
            old=$(git show "HEAD~1:$toc" 2>/dev/null | grep -m1 '^## Version:' | cut -d' ' -f3 | tr -d '\r' || true)
            pid_var="CF_PROJECT_$name"; pid="${!pid_var}"
            if [ -z "$pid" ]; then echo "$name：沒有專案 ID，跳過"; continue; fi
            if [ "$ver" = "$old" ] && [ "$FORCE" != "true" ]; then echo "$name：版本 $ver 沒變，跳過"; continue; fi
            python3 tools/package.py "$name"
            node tools/cf-upload.mjs "$pid" "dist/$name-$ver.zip" "$CF_GAME_VERSION" beta changelog.md
          done
