name: 上傳 CurseForge

# 插件版本號（toc 的 ## Version）有變才上傳；也可以手動執行（force 全部上傳）
on:
  push:
    branches: [main]
    paths: ["addon/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "不管版本號有沒有變都上傳"
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 打包並上傳有改版號的插件
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
          CF_PROJECT_ShengHealing: ${{ vars.CF_PROJECT_HEALING }}
          CF_PROJECT_ShengProfession: ${{ vars.CF_PROJECT_PROFESSION }}
          FORCE: ${{ inputs.force }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_GAME_VERSION" ]; then echo "還沒設定 CF_API_TOKEN 或 CF_GAME_VERSION，跳過"; exit 0; fi
          for name in ShengHealing ShengProfession; do
            toc="addon/$name/$name.toc"
            ver=$(grep -m1 '^## Version:' "$toc" | cut -d' ' -f3 | tr -d '\r')
            # 跟這次推送之前比（一次推好幾個提交也抓得到）；手動執行時跟上一個提交比
            base="${BEFORE:-HEAD~1}"; case "$base" in 0000000*) base=HEAD~1;; esac
            old=$(git show "$base:$toc" 2>/dev/null | grep -m1 '^## Version:' | cut -d' ' -f3 | tr -d '\r' || true)
            pid_var="CF_PROJECT_$name"; pid="${!pid_var}"
            if [ -z "$pid" ]; then echo "$name：沒有專案 ID，跳過"; continue; fi
            if [ "$ver" = "$old" ] && [ "$FORCE" != "true" ]; then echo "$name：版本 $ver 沒變，跳過"; continue; fi
            # 版本號帶 beta（例如 1.1.0-beta）才發測試版，其餘都發正式版
            case "$ver" in *beta*) rt=beta;; *) rt=release;; esac
            # 更新說明只用最後一個改到這個插件的提交，兩個插件的說明不會混在一起
            git log -1 --format=%B -- "addon/$name" > changelog.md
            python3 tools/package.py "$name"
            node tools/cf-upload.mjs "$pid" "dist/$name-$ver.zip" "$CF_GAME_VERSION" "$rt" changelog.md
          done
